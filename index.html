<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📚 Student Study Planner</h1>
    <p>Plan your studies, track your tasks and stay organized.</p>
</header>

<main>

    <section class="card">
        <h2>Add Study Task</h2>

        <input type="text" id="taskInput" placeholder="Enter study task">

        <select id="subjectInput">
            <option value="">Select Subject</option>
            <option value="Web Development">Web Development</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="C Programming">C Programming</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Other">Other</option>
        </select>

        <input type="date" id="dateInput">

        <button onclick="addTask()">Add Task</button>
    </section>

    <section class="card">
        <h2>My Study Tasks</h2>

        <div id="taskList">
            <p>No tasks added yet.</p>
        </div>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
